name: 'Setup Node.js Environment'
description: 'Common setup steps for root and routing-system dependencies'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          agent-skill-routing-system/package-lock.json

    - shell: bash
      run: npm ci

    - shell: bash
      run: npm ci --prefix agent-skill-routing-system
